# Publish the latest release's installer page on GitHub Pages, so it opens
# straight from a link. The page is taken from the release's assets: it holds
# audio derived from the third-party Amen sample, which never goes into git
# (see assets/third-party/amen/README.md).
name: Installer page

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Take the installer from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*-installer.html' --dir site
          mv site/*-installer.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
